apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: service-lab
spec:
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          env:
            - {name: POSTGRES_DB, value: service_lab}
            - {name: POSTGRES_USER, value: service_lab}
            - {name: POSTGRES_PASSWORD, value: change-me}
          ports:
            - {containerPort: 5432}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: service-lab
spec:
  selector: {app: postgres}
  ports:
    - {port: 5432, targetPort: 5432}
