name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: python -m pytest

  browser-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.txt
      - run: npm install
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - name: Start service
        run: |
          DATABASE_URL=sqlite:///./ci.db uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/service-lab.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:8000/ready && exit 0; sleep 1; done
          cat /tmp/service-lab.log
          exit 1
      - run: npm run test:e2e
        env:
          BASE_URL: http://127.0.0.1:8000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
